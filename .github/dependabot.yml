# Автоматические обновления зависимостей.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: cargo
    directory: /migration-master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Мажорные обновления ломают сборку чаще, чем приносят пользу:
    # обновляются только minor и patch, мажорные — вручную.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Мажорные версии actions часто требуют правок в workflow — обновляем
    # их вручную.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
