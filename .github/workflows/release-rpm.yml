name: Release RPM

# Сборка release RPM-пакета на Linux (без Docker, обычный раннер GitHub Actions).
# По умолчанию — пакет с GUI (GTK4 + libadwaita): линковка через cargo-zigbuild
# (zig cc) с потолком glibc 2.28, поэтому пакет устанавливается на РЕД ОС
# независимо от glibc хоста CI (ubuntu-latest даёт GLIBC_2.39, на РЕД ОС такого
# нет — установка падала с "libc.so.6(GLIBC_2.xx)(64bit) is needed").
# Ручной запуск с variant=musl — статическая musl-сборка CLI без GUI.
# Триггеры: тег v*; ручной запуск.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      variant:
        description: "Вариант сборки: gui (GTK4, glibc <= 2.28) или musl (статический CLI)"
        type: choice
        options:
          - gui
          - musl
        default: gui

jobs:
  rpm:
    name: Build RPM (release)
    # Только для тегов и ручного запуска: на каждый push в main пакет не собираем,
    # чтобы не расходовать лимит CI. Основной прогон тестов — в rust.yml.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # contents: write нужен для загрузки RPM в GitHub Releases: GITHUB_TOKEN
    # по умолчанию read-only, и шаг публикации падает с 403 "Resource not
    # accessible by integration".
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Определить версию
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Ручной запуск: версия берётся из spec, чтобы не расходиться с ним.
            VERSION=$(sed -n 's/^Version:[[:space:]]*//p' migration-master/rpm/migration-master.spec | head -n1)
          else
            VERSION=${GITHUB_REF_NAME#v}
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Установить rpmbuild и зависимости сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm build-essential pkg-config \
            musl-tools zstd cpio \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev libgirepository1.0-dev \
            libpango1.0-dev libcairo2-dev libssl-dev \
            libsqlite3-dev libcups2-dev

      - name: Установить Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # musl-таргет нужен для статической сборки (опция spec --with musl).
          "$HOME/.cargo/bin/rustup" target add x86_64-unknown-linux-musl

      - name: Установить zig и cargo-zigbuild (линковка с потолком glibc)
        if: inputs.variant != 'musl'
        run: |
          set -euo pipefail
          # Последняя стабильная версия zig и ссылка на архив берутся из
          # официального индекса скачиваний: имена архивов меняются между версиями.
          curl -sSfL https://ziglang.org/download/index.json -o "$RUNNER_TEMP/zig-index.json"
          python3 - "$RUNNER_TEMP/zig-index.json" <<'PYEOF' > "$RUNNER_TEMP/zig.env"
          import json, sys
          idx = json.load(open(sys.argv[1]))
          stable = next(k for k in idx if k != "master")
          arch = idx[stable]["x86_64-linux"]
          print("ZIG_VERSION=" + stable)
          print("ZIG_URL=" + arch["tarball"])
          print("ZIG_SHASUM=" + arch["shasum"])
          PYEOF
          . "$RUNNER_TEMP/zig.env"
          curl -sSfL "$ZIG_URL" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$ZIG_SHASUM  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild
          echo "Установлен zig $ZIG_VERSION"

      - name: Подготовить исходники (tarball для Source0)
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          # Корень исходников пакета — каталог migration-master/, а не корень
          # репозитория: spec ожидает resources/, docs/, src/ на верхнем уровне.
          tar czf "migration-master-${VERSION}.tar.gz" \
            --transform "s,^migration-master,migration-master-${VERSION}," \
            --exclude-vcs --exclude='./target' \
            migration-master

      - name: Собрать RPM
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p ~/rpmbuild/{SOURCES,SPECS,BUILD,RPMS,SRPMS}
          mv "migration-master-${VERSION}.tar.gz" ~/rpmbuild/SOURCES/
          cp migration-master/rpm/migration-master.spec ~/rpmbuild/SPECS/
          # --nodeps: rpmbuild -bb проверяет BuildRequires через rpm, которого на
          # ubuntu-latest нет. Зависимости уже установлены шагом выше, поэтому
          # проверку пропускаем (на РЕД ОС spec собирается как обычно).
          if [ "${{ inputs.variant }}" = "musl" ]; then
            # musl-вариант: статические бинарники без зависимостей от glibc —
            # установка на любую РЕД ОС (только CLI, без GUI).
            rpmbuild -bb --nodeps ~/rpmbuild/SPECS/migration-master.spec \
              --define "_topdir $HOME/rpmbuild" \
              --define "version ${VERSION}" \
              --with musl
          else
            # GUI-вариант по умолчанию: zig cc линкует бинарники против glibc
            # не новее 2.28 (glibc_floor в spec) — пакет с GUI устанавливается
            # на РЕД ОС, где glibc старше, чем на раннере CI.
            rpmbuild -bb --nodeps ~/rpmbuild/SPECS/migration-master.spec \
              --define "_topdir $HOME/rpmbuild" \
              --define "version ${VERSION}" \
              --with gui \
              --define "zigbuild 1"
          fi

      - name: Проверить пакет (musl)
        if: inputs.variant == 'musl'
        run: |
          set -euo pipefail
          RPM=$(ls ~/rpmbuild/RPMS/x86_64/*.rpm)
          rpm -qlp "$RPM"
          echo "== Зависимости пакета =="
          rpm -qpR "$RPM" || true
          # musl-пакет обязан быть независимым от glibc: ни одной версии
          # GLIBC в зависимостях. Иначе на РЕД ОС установка упадёт.
          if rpm -qpR "$RPM" | grep -q 'GLIBC_'; then
            echo "::error::Пакет требует версии GLIBC — musl-сборка не сработала"
            exit 1
          fi
          echo "OK: версий GLIBC в зависимостях нет (статическая musl-сборка)."

      - name: Проверить пакет (gui)
        if: inputs.variant != 'musl'
        run: |
          set -euo pipefail
          RPM=$(ls ~/rpmbuild/RPMS/x86_64/*.rpm)
          rpm -qlp "$RPM"
          echo "== Зависимости пакета =="
          rpm -qpR "$RPM" || true
          # 1) Ни одна версия GLIBC в зависимостях не выше потолка 2.28,
          #    иначе установка на РЕД ОС упадёт с "is needed".
          # 2) GUI действительно слинкован: среди зависимостей есть GTK4
          #    и libadwaita.
          python3 - "$RPM" <<'PYEOF'
          import re, subprocess, sys
          out = subprocess.run(["rpm", "-qpR", sys.argv[1]], capture_output=True, text=True).stdout
          floor = (2, 28)
          vers = [tuple(map(int, v.split("."))) for v in re.findall(r"GLIBC_(\d+(?:\.\d+)*)", out)]
          if not vers:
              print("::error::Нет ни одной версии GLIBC в зависимостях — ожидалась динамическая сборка")
              sys.exit(1)
          bad = sorted({v for v in vers if v > floor})
          if bad:
              msg = ", ".join(".".join(map(str, v)) for v in bad)
              print("::error::Слишком новые версии GLIBC: " + msg + " (потолок 2.28)")
              sys.exit(1)
          print("OK: максимальная версия GLIBC = " + ".".join(map(str, max(vers))))
          for soname in ("libgtk-4", "libadwaita"):
              if soname not in out:
                  print("::error::Среди зависимостей нет " + soname + " — GUI не слинкован")
                  sys.exit(1)
          print("OK: GTK4 и libadwaita присутствуют в зависимостях")
          PYEOF
          # 3) Smoke-тест: rpmbuild уже удалил BUILD/BUILDROOT, поэтому
          #    распаковываем бинарник ИЗ готового RPM и запускаем: он должен
          #    уходить в GUI-код, а не отвечать «графический интерфейс
          #    недоступен». Дисплея в CI нет — GTK завершится с ошибкой
          #    открытия дисплея, это ожидаемо.
          TMP=$(mktemp -d)
          (cd "$TMP" && rpm2cpio "$RPM" | cpio -idm --quiet)
          BIN="$TMP/usr/bin/migration-master"
          echo "Бинарник: $BIN"
          timeout 30 "$BIN" --version
          OUT=$(timeout 30 "$BIN" gui 2>&1 || true)
          echo "$OUT"
          if echo "$OUT" | grep -q 'графический интерфейс недоступен'; then
            echo "::error::Бинарник собран без фичи gui"
            exit 1
          fi
          rm -rf "$TMP"
          echo "OK: GUI-код запускается (ошибка дисплея в CI ожидаема)."

      - name: Сохранить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: migration-master-rpm-${{ steps.ver.outputs.version }}
          path: ~/rpmbuild/RPMS/x86_64/*.rpm
          if-no-files-found: error

      - name: Прикрепить RPM к GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ~/rpmbuild/RPMS/x86_64/*.rpm



