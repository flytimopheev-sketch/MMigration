name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # GTK4/libadwaita нужны только для сборки GUI (--features gui).
    # Без libgirepository1.0-dev / libgtk-4-dev падает сборка gobject-sys:
    # "Package gobject-2.0 was not found in the pkg-config search path".
    - name: Установить системные зависимости GTK4
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-4-dev libadwaita-1-dev libglib2.0-dev libgirepository1.0-dev \
          libpango1.0-dev libcairo2-dev libssl-dev pkg-config

    # Проект лежит в подкаталоге migration-master/ — Cargo.toml в корне нет.
    - name: Проверка форматирования
      working-directory: migration-master
      run: cargo fmt --all -- --check

    - name: Clippy
      working-directory: migration-master
      run: cargo clippy --all-targets -- -D warnings

    - name: Build (CLI)
      working-directory: migration-master
      run: cargo build --verbose

    - name: Run tests (CLI)
      working-directory: migration-master
      run: cargo test --verbose

    # GUI собирается только на Linux с фичей `gui`.
    - name: Build (GUI, feature gui)
      working-directory: migration-master
      run: cargo build --verbose --features gui
