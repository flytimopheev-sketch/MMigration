[package]
name = "migration-master"
version = "0.1.0"
edition = "2021"
authors = ["Migration Master Team"]
description = "Мастер миграции пользователя для РЕД ОС Linux"
license = "GPL-3.0"
repository = "https://github.com/redos/migration-master"
keywords = ["migration", "backup", "redos", "linux", "desktop"]
categories = ["system", "utilities"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
yaml-rust2 = "0.9"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# SSH
ssh2 = "0.9"

# Compression and archiving
tar = "0.4"
zstd = "0.13"
flate2 = "1.0"

# Encryption
age = { version = "0.12", features = ["armor"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"
once_cell = "1.19"

# System information
sysinfo = "0.30"
whoami = "1.4"
hostname = "0.3"
dirs = "5.0"
users = "0.11"
which = "6.0"

# File system utilities
walkdir = "2.4"
tempfile = "3.9"
fs_extra = "1.3"
glob = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Random for password generation
rand = "0.8"

# Human-readable sizes
human_bytes = "0.4"

# Regex
regex = "1.10"

# MIME type detection
mime_guess = "2.0"

# URL parsing for network printers
url = "2.5"

# Base64 encoding
base64 = "0.21"

# UUID for unique IDs
uuid = { version = "1.6", features = ["v4"] }

[dev-dependencies]
criterion = "0.5"
mockall = "0.12"
assert_cmd = "2.0"
predicates = "3.1"

[features]
default = []
gui = []
cli-only = []

[[bin]]
name = "migration-master"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = true
